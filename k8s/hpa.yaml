apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wanderlust-hpa
  labels:
    app: wanderlust
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wanderlust-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70